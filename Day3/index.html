<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Coding Tutor</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#0f172a;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
    }

    .chat-container{
      width:420px;
      height:650px;
      background:#1e293b;
      border-radius:20px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    .header{
      background:#2563eb;
      padding:18px;
      text-align:center;
      font-size:22px;
      font-weight:bold;
    }

    .chat-box{
      flex:1;
      padding:15px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .message{
      max-width:80%;
      padding:12px 15px;
      border-radius:15px;
      line-height:1.5;
      word-wrap:break-word;
    }

    .user{
      align-self:flex-end;
      background:#2563eb;
    }

    .bot{
      align-self:flex-start;
      background:#334155;
    }

    .input-area{
      display:flex;
      padding:12px;
      background:#0f172a;
      gap:10px;
    }

    .input-area input{
      flex:1;
      padding:12px;
      border:none;
      outline:none;
      border-radius:10px;
      font-size:16px;
    }

    .input-area button{
      padding:12px 18px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .input-area button:hover{
      background:#1d4ed8;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      AI Coding Tutor
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">
        Hello 👋 Ask coding related questions only.
      </div>
    </div>

    <div class="input-area">
      <input 
        type="text" 
        id="question" 
        placeholder="Ask coding question..."
      />
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>
    const chatBox = document.getElementById("chatBox");

    async function sendMessage() {

      const input = document.getElementById("question");
      const question = input.value.trim();

      if(question === "") return;

      // User Message
      const userMsg = document.createElement("div");
      userMsg.classList.add("message", "user");
      userMsg.innerText = question;
      chatBox.appendChild(userMsg);

      input.value = "";

      // Bot Loading Message
      const botMsg = document.createElement("div");
      botMsg.classList.add("message", "bot");
      botMsg.innerText = "Typing...";
      chatBox.appendChild(botMsg);

      chatBox.scrollTop = chatBox.scrollHeight;

      try {

        // Backend API Call
        const response = await fetch("http://localhost:3000/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question })
        });

        const data = await response.json();

        botMsg.innerText = data.reply;

      } catch (error) {

        botMsg.innerText = "Error connecting to server";

      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
