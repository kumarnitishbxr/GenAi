<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Ludo Game</h1>

    <div id="game-board"></div>

    <div class="controls">

        <p>Dice: <span id="dice-value">-</span></p>

        <p>Current Player:

        </p>
    </div>

    <script src="script.js"></script>

</body>
</html>
